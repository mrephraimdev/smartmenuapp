# ===========================================
# HorusPOS SaaS - Docker Compose STAGING
# Pour tests en ligne (debug activé, image auto-suffisante)
# Usage: docker compose -f docker-compose.staging.yml up -d
# ===========================================

version: '3.8'

services:
  # ===========================================
  # Application Laravel (nginx + php-fpm + queue + scheduler)
  # Tout-en-un via supervisord
  # ===========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: horuspos-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    environment:
      APP_NAME: "${APP_NAME:-HorusPOS}"
      APP_ENV: "${APP_ENV:-staging}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Africa/Abidjan}"
      APP_LOCALE: "fr"
      DB_CONNECTION: "pgsql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "${DB_DATABASE:-horuspos}"
      DB_USERNAME: "${DB_USERNAME:-horuspos}"
      DB_PASSWORD: "${DB_PASSWORD:-horuspos_secret}"
      REDIS_CLIENT: "phpredis"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"
      CACHE_STORE: "redis"
      SESSION_DRIVER: "redis"
      SESSION_LIFETIME: "120"
      QUEUE_CONNECTION: "redis"
      LOG_CHANNEL: "stack"
      LOG_LEVEL: "debug"
      MAIL_MAILER: "log"
      DEFAULT_CURRENCY: "${DEFAULT_CURRENCY:-XOF}"
      QR_CODE_SIZE: "300"
      QR_CODE_MARGIN: "10"
      ORDER_NUMBER_PREFIX: "CMD"
      ORDER_EXPIRY_HOURS: "24"
      TENANT_ISOLATION: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - horuspos-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ===========================================
  # PostgreSQL
  # ===========================================
  postgres:
    image: postgres:15-alpine
    container_name: horuspos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-horuspos}"
      POSTGRES_USER: "${DB_USERNAME:-horuspos}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-horuspos_secret}"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    networks:
      - horuspos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-horuspos} -d ${DB_DATABASE:-horuspos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================
  # Redis
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: horuspos-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - horuspos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  horuspos-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  storage_app:
    driver: local
  storage_logs:
    driver: local
